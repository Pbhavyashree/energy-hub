name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  # Maven itself was the one dependency this build never pinned, and in
  # October 2026 that caught up with it. The runner image updated, its
  # bundled Maven came with a newer Resolver, and mule-maven-plugin 4.1.0 -
  # compiled against the old one - died with:
  #
  #   NoSuchMethodError: DefaultMirrorSelector.add(
  #       String, String, String, boolean, String, String)
  #
  # Nothing in the project had changed, and the same commits built fine on
  # a laptop. Every dependency in the four poms carries a version; the tool
  # that reads them did not, so the build was pinned everywhere except the
  # one place it ran unattended.
  MAVEN_VERSION: '3.9.9'

jobs:
  test:
    name: ${{ matrix.module }}
    runs-on: ubuntu-latest

    strategy:
      # Every module is reported even when one fails, so a broken change in
      # one layer does not hide the state of the others.
      fail-fast: false
      matrix:
        module:
          - sys-api-awattar
          - sys-api-entsoe
          - process-api
          - exp-api-home

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Pin Maven ${{ env.MAVEN_VERSION }}
        run: |
          curl -fsSL "https://archive.apache.org/dist/maven/maven-3/${MAVEN_VERSION}/binaries/apache-maven-${MAVEN_VERSION}-bin.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-${MAVEN_VERSION}/bin" >> "$GITHUB_PATH"

      # Printed on purpose: when this breaks again in two years, the log
      # should say which Maven ran without anyone having to guess.
      - name: Versions
        run: mvn -v

      # No credentials needed: config.yaml ships a placeholder token and every
      # test mocks the upstream, so the suite never reaches the network.
      - name: Run MUnit tests
        working-directory: ${{ matrix.module }}
        run: mvn --batch-mode --no-transfer-progress clean test

      - name: Package deployable artifact
        working-directory: ${{ matrix.module }}
        run: mvn --batch-mode --no-transfer-progress package -DskipTests

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.module }}
          path: ${{ matrix.module }}/target/*-mule-application.jar
          retention-days: 7

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: munit-reports-${{ matrix.module }}
          path: ${{ matrix.module }}/target/munit-reports/
          retention-days: 7
          if-no-files-found: ignore
