name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.module }}
    runs-on: ubuntu-latest

    strategy:
      # Both modules are reported even when one fails, so a broken change in
      # one system API does not hide the state of the other.
      fail-fast: false
      matrix:
        module:
          - sys-api-awattar
          - sys-api-entsoe
          - process-api

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # No credentials needed: config.yaml ships a placeholder token and every
      # test mocks the upstream, so the suite never reaches the network.
      - name: Run MUnit tests
        working-directory: ${{ matrix.module }}
        run: mvn --batch-mode --no-transfer-progress clean test

      - name: Package deployable artifact
        working-directory: ${{ matrix.module }}
        run: mvn --batch-mode --no-transfer-progress package -DskipTests

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.module }}
          path: ${{ matrix.module }}/target/*-mule-application.jar
          retention-days: 7

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: munit-reports-${{ matrix.module }}
          path: ${{ matrix.module }}/target/munit-reports/
          retention-days: 7
          if-no-files-found: ignore
