# Non-secret configuration. Every value must be QUOTED - Mule's YAML
# property reader accepts strings only, and an unquoted number stops the
# application deploying.

api:
  port: "8090"

# The system APIs this layer orchestrates. Localhost for now; these
# become service names once the stack is containerised.
sys:
  entsoe:
    host: "localhost"
    port: "8091"
  awattar:
    host: "localhost"
    port: "8092"

upstream:
  # Per-call timeout for a single system API.
  timeoutMs: "25000"
  # Budget for the scatter-gather as a whole. Must exceed timeoutMs, or
  # a slow-but-healthy upstream is cut off before it can answer.
  budgetMs: "30000"

crosscheck:
  # Maximum tolerated difference, per kWh, between an aWATTar hourly
  # price and the mean of the four ENTSO-E quarter-hours inside it.
  # 0.0001/kWh is 0.1 EUR/MWh. Observed agreement on live data was exact.
  toleranceKWh: "0.0001"

db:
  url: "jdbc:postgresql://localhost:5432/energyhub"
  user: "postgres"
  # Local development password only. The deployed instance overrides it
  # with a system property, the same way the ENTSO-E token is supplied:
  #   -Ddb.password=...
  # so a real credential never enters the working tree.
  password: "postgres"
  # Small pool: this is one application talking to one database, and the
  # work is short reads plus one bulk write per poll.
  poolMax: "5"

poll:
  # The day-ahead auction clears around 12:45 CET. Polling hourly from
  # 13:00 to 23:00 Berlin is enough to catch it plus any late
  # publication; polling every minute only burns the ENTSO-E rate limit.
  cron: "0 0 13-23 * * ?"
  timeZone: "Europe/Berlin"
  # Zones polled on a schedule. Others are still served on demand.
  biddingZone: "DE_LU"
  # ENTSO-E is slow rather than broken, especially at 13:00 Berlin when
  # every consumer in Europe asks for the freshly cleared auction at once.
  # Two extra attempts with a long gap, which is affordable here and not
  # on the serving path - see the comment in poll-entsoe.
  #
  # Worst case is roughly 25s + 15s + 25s + 15s + 25s, under two minutes,
  # against an hourly schedule.
  retries: "2"
  retryDelayMs: "15000"

alert:
  # Negative day-ahead prices are the event this project exists to
  # notice: the wholesale price goes below zero often enough in Germany
  # to matter, and it is exactly the thing a person would act on.
  negativeEnabled: "true"
  # Credentials come from the environment in a deployed instance, the
  # same way the ENTSO-E token does. REPLACE_AT_RUNTIME keeps a working
  # placeholder in the tree without a working credential in it.
  telegramToken: "REPLACE_AT_RUNTIME"
  telegramChatId: "REPLACE_AT_RUNTIME"
